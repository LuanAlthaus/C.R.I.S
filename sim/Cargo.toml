[package]
name = "mars_sim"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mars_sim_native"
path = "src/main.rs"

[dependencies]
# "3d" only: drops the default 2d, ui and audio features to keep the wasm small.
bevy = { version = "0.20.1", default-features = false, features = ["3d", "png", "jpeg"] }
pathfinding = "4.16.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Event", "EventTarget", "CustomEvent", "CustomEventInit"] }

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
